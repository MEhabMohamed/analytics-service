services:
  mongo:
    image: mongo:7
    container_name: quickbite_analytics_mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
      - ./scripts/docker/01-init-mongo.js:/docker-entrypoint-initdb.d/01-init-mongo.js:ro
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      retries: 10

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      retries: 10

  analytics-service:
    build: .
    env_file:
      - .env
    environment:
      MONGO_URI: mongodb://mongo:27017
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
      CORE_SERVICE_BASE_URL: http://host.docker.internal:3000
    ports:
      - "5000:5000"
    depends_on:
      mongo:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

volumes:
  mongo-data:

