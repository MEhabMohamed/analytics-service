name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: eu-north-1
  ECR_REPO: analytics-service
  ECS_SERVICE: analytics-service

jobs:
  test:
    name: Build and Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Run tests
        run: docker compose -f docker-compose.test.yml run --rm test
      - name: Stop containers
        if: always()
        run: docker compose -f docker-compose.test.yml down -v

  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::909077322399:role/github_deploy
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build & push
        run: |
          REG=${{ steps.ecr.outputs.registry }}
          docker build -t $REG/${{ env.ECR_REPO }}:${{ github.sha }} -t $REG/${{ env.ECR_REPO }}:latest .
          docker push $REG/${{ env.ECR_REPO }} --all-tags

      - name: Deploy
        run: aws ecs update-service --cluster quickbite-1 --service ${{ env.ECS_SERVICE }} --force-new-deployment
