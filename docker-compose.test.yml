# =====================================================================
# CI test stack. Mirrors the other services' docker-compose.test.yml.
#
#   docker compose -f docker-compose.test.yml run --rm test
#
# The unit suite is pure (no Mongo/RabbitMQ needed), so the test service
# compiles everything, runs go vet, and runs the unit test packages.
# =====================================================================
services:
  test:
    image: golang:1.25-alpine
    working_dir: /app
    environment:
      PORT: "5000"
      ENV: "test"
      MONGO_DB: "quickbite_analytics_test"
      ACCESS_SECRET: "test-access-secret"
      INTERNAL_API_KEY: "test-internal-api-key"
      CORE_INTERNAL_API_KEY: "test-internal-api-key"
    volumes:
      - .:/app
      - go-build-cache:/root/.cache/go-build
      - go-mod-cache:/go/pkg/mod
    command: sh -e -c "go build ./... && go vet ./... && go test ./lib/... ./app/... ./tests/unit/..."

volumes:
  go-build-cache:
  go-mod-cache:
